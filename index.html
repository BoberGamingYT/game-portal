<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="creator-tag">Created by BoberGamingYT</div>

    <div class="page-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">G</div>
          <div>
            <span class="eyebrow">Arcade</span>
            <h1>Game Portal</h1>
          </div>
        </div>

        <nav class="nav" id="game-nav" aria-label="Game menu"></nav>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Welcome back</p>
            <h2>Pick a game and start playing</h2>
          </div>
          <button class="primary-button" id="reset-current-game">Reset Game</button>
        </header>

        <section id="game-panels"></section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
